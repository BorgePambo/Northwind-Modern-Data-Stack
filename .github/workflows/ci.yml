# .github/workflows/ci.yml
# Pipeline de CI para Pull Requests
# Executa automaticamente a cada PR aberto, sincronizado ou reaberto para main/develop.
#
# Passos:
#   1. dbt deps       → instala dependências (dbt-utils, etc.)
#   2. dbt parse      → valida sintaxe e compilação dos modelos
#   3. dbt build      → executa seeds + modelos + testes em ambiente de CI
#
# Credenciais Databricks via GitHub Secrets:
#   DATABRICKS_HOST           → URL do workspace (ex: https://adb-xxx.azuredatabricks.net)
#   DATABRICKS_TOKEN          → Personal Access Token
#   DATABRICKS_HTTP_PATH      → HTTP Path do SQL Warehouse
#   DATABRICKS_CATALOG        → Catalog Unity (dbt_northwind)
#   DATABRICKS_SCHEMA_CI      → Schema de CI isolado (ex: ci_<PR_NUMBER>)

name: dbt CI

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'models/**'
      - 'seeds/**'
      - 'snapshots/**'
      - 'macros/**'
      - 'tests/**'
      - 'dbt_project.yml'
      - 'packages.yml'

jobs:
  dbt-ci:
    name: dbt Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}
      DBT_TARGET: ci

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout do código
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. Setup Python
      # -----------------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # -----------------------------------------------------------------------
      # 3. Instalar dbt-databricks
      # -----------------------------------------------------------------------
      - name: Install dbt-databricks
        run: |
          pip install --upgrade pip
          pip install dbt-databricks==1.8.*

      # -----------------------------------------------------------------------
      # 4. Gerar profiles.yml de CI dinamicamente (sem commitar credenciais)
      # -----------------------------------------------------------------------
      - name: Generate profiles.yml for CI
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << EOF
          northwind_dbt:
            target: ci
            outputs:
              ci:
                type: databricks
                host: ${{ secrets.DATABRICKS_HOST }}
                http_path: ${{ secrets.DATABRICKS_HTTP_PATH }}
                token: ${{ secrets.DATABRICKS_TOKEN }}
                catalog: ${{ secrets.DATABRICKS_CATALOG }}
                schema: ci_pr_${{ github.event.number }}
                threads: 4
          EOF

      # -----------------------------------------------------------------------
      # 5. dbt deps — instala pacotes (dbt-utils etc.)
      # -----------------------------------------------------------------------
      - name: dbt deps
        run: dbt deps
        working-directory: ${{ github.workspace }}

      # -----------------------------------------------------------------------
      # 6. dbt parse — valida sintaxe e compilação sem executar
      # -----------------------------------------------------------------------
      - name: dbt parse
        run: dbt parse
        working-directory: ${{ github.workspace }}

      # -----------------------------------------------------------------------
      # 7. dbt build — executa seeds + run + test em schema de CI isolado
      # Usa --select para incluir apenas modelos alterados na PR (slim CI)
      # -----------------------------------------------------------------------
      - name: dbt build (slim CI)
        run: |
          dbt build \
            --select state:modified+ \
            --defer \
            --state ./target \
            --target ci \
            --fail-fast
        working-directory: ${{ github.workspace }}
        continue-on-error: false

      # -----------------------------------------------------------------------
      # 8. Upload manifest como artefato (usado para slim CI em PRs futuras)
      # -----------------------------------------------------------------------
      - name: Upload dbt manifest
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dbt-manifest-pr-${{ github.event.number }}
          path: target/manifest.json
          retention-days: 7

      # -----------------------------------------------------------------------
      # 9. Limpeza do schema de CI após testes
      # -----------------------------------------------------------------------
      - name: Cleanup CI schema
        if: always()
        run: |
          dbt run-operation drop_schema \
            --args "{'schema': 'ci_pr_${{ github.event.number }}'}" \
            --target ci || true
        working-directory: ${{ github.workspace }}
