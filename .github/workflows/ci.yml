
# .github/workflows/ci.yml
#
# CI do projeto dbt + Databricks.
#
# Executa em Pull Requests para develop e main.
#
# Fluxo:
#   1. Checkout
#   2. Python
#   3. Instala dbt
#   4. Cria profiles.yml temporário
#   5. dbt deps
#   6. dbt parse
#   7. dbt build em schema isolado
#   8. Upload do manifest
#   9. Cleanup do schema CI
#
# Secrets necessários:
#   DATABRICKS_HOST
#   DATABRICKS_TOKEN
#   DATABRICKS_HTTP_PATH
#   DATABRICKS_CATALOG

name: dbt CI

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'airflow_dbt/include/northwind_dbt/**'

  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DBT_PROJECT_DIR: airflow_dbt/include/northwind_dbt

jobs:
  dbt-ci:
    name: dbt Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # 3. dbt
      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install "dbt-core==1.12.0" "dbt-databricks==1.12.4"

      # 4. Definir schema exclusivo do PR
      - name: Define CI schema
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CI_SCHEMA="ci_pr_${{ github.event.number }}"
          else
            CI_SCHEMA="ci_manual"
          fi

          echo "CI_SCHEMA=${CI_SCHEMA}" >> "$GITHUB_ENV"

      # 5. Criar profiles.yml
      - name: Generate profiles.yml
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_CATALOG: ${{ secrets.DATABRICKS_CATALOG }}
        run: |
          mkdir -p ~/.dbt

          cat > ~/.dbt/profiles.yml <<EOF
          northwind_dbt:
            target: ci
            outputs:
              ci:
                type: databricks
                host: "${DATABRICKS_HOST}"
                http_path: "${DATABRICKS_HTTP_PATH}"
                token: "${DATABRICKS_TOKEN}"
                catalog: "${DATABRICKS_CATALOG}"
                schema: "${CI_SCHEMA}"
                threads: 4
          EOF

      # 6. dbt deps
      - name: dbt deps
        working-directory: ${{ env.DBT_PROJECT_DIR }}
        run: dbt deps

      # 7. dbt parse
      - name: dbt parse
        working-directory: ${{ env.DBT_PROJECT_DIR }}
        run: dbt parse --target ci

      # 8. dbt build
      - name: dbt build
        working-directory: ${{ env.DBT_PROJECT_DIR }}
        run: dbt build --target ci --fail-fast

      # 9. Manifest
      - name: Upload dbt manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-manifest-pr-${{ github.event.number }}
          path: ${{ env.DBT_PROJECT_DIR }}/target/manifest.json
          retention-days: 7

      # 10. Cleanup
      - name: Cleanup CI schema
        if: always()
        working-directory: ${{ env.DBT_PROJECT_DIR }}
        run: |
          dbt run-operation drop_schema \
            --args "{\"schema\": \"${CI_SCHEMA}\"}" \
            --target ci \
          || echo "Cleanup skipped or schema already removed"
