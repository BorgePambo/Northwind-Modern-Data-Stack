name: dbt CI

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'airflow_dbt/include/northwind_dbt/models/**'
      - 'airflow_dbt/include/northwind_dbt/seeds/**'
      - 'airflow_dbt/include/northwind_dbt/snapshots/**'
      - 'airflow_dbt/include/northwind_dbt/macros/**'
      - 'airflow_dbt/include/northwind_dbt/tests/**'
      - 'airflow_dbt/include/northwind_dbt/dbt_project.yml'
      - 'airflow_dbt/include/northwind_dbt/packages.yml'

  workflow_dispatch:

jobs:
  dbt-ci:
    name: dbt Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dbt-databricks
        run: |
          pip install --upgrade pip
          pip install dbt-databricks==1.8.*

      - name: Generate profiles.yml for CI
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << EOF
          northwind_dbt:
            target: ci
            outputs:
              ci:
                type: databricks
                host: ${{ secrets.DATABRICKS_HOST }}
                http_path: ${{ secrets.DATABRICKS_HTTP_PATH }}
                token: ${{ secrets.DATABRICKS_TOKEN }}
                catalog: ${{ secrets.DATABRICKS_CATALOG }}
                schema: ci_pr_${{ github.event.number }}
                threads: 4
          EOF

      - name: dbt deps
        run: dbt deps
        working-directory: airflow_dbt/include/northwind_dbt

      - name: dbt parse
        run: dbt parse
        working-directory: airflow_dbt/include/northwind_dbt

      - name: dbt build
        run: |
          dbt build \
            --target ci \
            --fail-fast
        working-directory: airflow_dbt/include/northwind_dbt

      - name: Upload dbt manifest
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dbt-manifest-pr-${{ github.event.number }}
          path: airflow_dbt/include/northwind_dbt/target/manifest.json
          retention-days: 7

      - name: Cleanup CI schema
        if: always()
        run: |
          dbt run-operation drop_schema \
            --args "{'schema': 'ci_pr_${{ github.event.number }}'}" \
            --target ci
        working-directory: airflow_dbt/include/northwind_dbt