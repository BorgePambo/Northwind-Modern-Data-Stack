name: CI - dbt Validation

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

env:
  DBT_PROFILES_DIR: airflow_dbt/include/northwind_dbt
  DBT_PROJECT_DIR: airflow_dbt/include/northwind_dbt

jobs:
  dbt-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install dbt-core==1.12.0
          pip install dbt-databricks==1.10.0
          pip install -r airflow_dbt/requirements.txt

      - name: dbt debug
        run: |
          cd ${{ env.DBT_PROJECT_DIR }}
          dbt debug --config-dir

      - name: dbt dependencies
        run: |
          cd ${{ env.DBT_PROJECT_DIR }}
          dbt deps

      - name: dbt parse
        run: |
          cd ${{ env.DBT_PROJECT_DIR }}
          dbt parse

      - name: dbt build (dry-run)
        run: |
          cd ${{ env.DBT_PROJECT_DIR }}
          dbt build --select state:modified+ --state ./target --exclude config.require_resource_names_without_spaces=False || true

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-artifacts-${{ github.run_id }}
          path: ${{ env.DBT_PROJECT_DIR }}/target
          retention-days: 5

  tests-python:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          pip install pytest
          pip install -r airflow_dbt/requirements.txt

      - name: Run Python tests
        run: |
          pytest tests/ -v --tb=short
        continue-on-error: true
