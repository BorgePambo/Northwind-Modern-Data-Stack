# .github/workflows/ci.yml

name: CI - dbt Databricks

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - main

jobs:
  dbt-ci:
    name: Validate dbt project
    runs-on: ubuntu-latest

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
      DATABRICKS_CATALOG: ${{ secrets.DATABRICKS_CATALOG }}

    defaults:
      run:
        working-directory: airflow_dbt/include/northwind_dbt

    steps:

      # ------------------------
      # Checkout
      # ------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------
      # Setup Python
      # ------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ------------------------
      # Install dbt
      # ------------------------
      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install \
            dbt-core==1.12.3 \
            dbt-databricks==1.10.9

      # ------------------------
      # Check dbt version
      # ------------------------
      - name: Check dbt version
        run: dbt --version

      # ------------------------
      # Setup dbt profile
      # ------------------------
      - name: Configure dbt profile
        run: |
          mkdir -p ~/.dbt

          cat > ~/.dbt/profiles.yml <<EOF
          northwind_dbt:
            target: ci
            outputs:
              ci:
                type: databricks
                host: ${{ secrets.DATABRICKS_HOST }}
                http_path: ${{ secrets.DATABRICKS_HTTP_PATH }}
                token: ${{ secrets.DATABRICKS_TOKEN }}
                catalog: ${{ secrets.DATABRICKS_CATALOG }}
                schema: bronze
                threads: 4
          EOF

      # ------------------------
      # Install dbt packages
      # ------------------------
      - name: Install dbt packages
        run: dbt deps

      # ------------------------
      # Validate dbt project
      # ------------------------
      - name: Validate dbt project
        run: dbt parse

      # ------------------------
      # Build dbt project
      # ------------------------
      - name: Build dbt project
        run: dbt build
