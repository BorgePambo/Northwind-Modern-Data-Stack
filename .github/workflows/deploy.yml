# Pipeline de Deploy para os ambientes dev e prod.
#
# Triggers automáticos:
#   → push em develop  → deploy no target dev  (schema: dbt_dev)
#   → push em main     → deploy no target prod (schemas: bronze / silver / gold)
#
# Trigger manual (workflow_dispatch):
#   → permite escolher o target (dev ou prod) independente da branch
#
# Fluxo de execução:
#   1. dbt deps      → instala pacotes
#   2. dbt parse     → valida sintaxe antes de executar
#   3. dbt seed      → carrega/atualiza seeds (bronze)
#   4. dbt snapshot  → SCD2 de customers (silver) — antes do run
#   5. dbt run       → executa modelos staging + intermediate + marts
#   6. dbt test      → testes genéricos + singulares
#
# Secrets necessários no GitHub (Settings → Secrets → Actions):
#   DATABRICKS_HOST       → https://adb-xxx.azuredatabricks.net
#   DATABRICKS_TOKEN      → Personal Access Token (PAT)
#   DATABRICKS_HTTP_PATH  → /sql/1.0/warehouses/<id>
