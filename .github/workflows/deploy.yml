env:
  DBT_PROJECT_DIR: airflow_dbt/include/northwind_dbt

jobs:
  # ---------------------------------------------------------------------------
  # Resolve o target dbt baseado na branch ou input manual
  # ---------------------------------------------------------------------------
  resolve-target:
    name: Resolve deploy target
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.set-target.outputs.target }}
      environment: ${{ steps.set-target.outputs.environment }}
    steps:
      - name: Set target based on branch or input
        id: set-target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ github.event.inputs.target }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TARGET="prod"
          elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            TARGET="dev"
          else
            echo "Branch não mapeada para nenhum target. Abortando."
            exit 1
          fi

          echo "target=${TARGET}" >> "$GITHUB_OUTPUT"

          if [ "$TARGET" = "prod" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
          else
            echo "environment=development" >> "$GITHUB_OUTPUT"
          fi

          echo "Resolved target: ${TARGET}"

  # ---------------------------------------------------------------------------
  # Job principal de deploy
  # ---------------------------------------------------------------------------
  dbt-deploy:
    name: dbt Deploy (${{ needs.resolve-target.outputs.target }})
