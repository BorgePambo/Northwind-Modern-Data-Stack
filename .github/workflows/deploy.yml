# .github/workflows/deploy.yml
#
# CD do projeto dbt + Databricks.
#
# Fluxo:
#
#   develop → DEV
#   main    → PROD
#
# O deploy executa:
#   1. dbt deps
#   2. dbt parse
#   3. dbt build
#
# dbt build executa seeds, snapshots, models e testes
# respeitando as dependências do DAG do dbt.
#
# Secrets necessários:
#   DATABRICKS_HOST
#   DATABRICKS_TOKEN
#   DATABRICKS_HTTP_PATH
#   DATABRICKS_CATALOG
#
# GitHub Environments recomendados:
#   development
#   production

name: dbt Deploy

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'airflow_dbt/include/northwind_dbt/**'

  workflow_dispatch:
    inputs:
      target:
        description: 'Ambiente de deploy'
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

      full_refresh:
        description: 'Executar dbt com --full-refresh?'
        required: true
        default: false
        type: boolean

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  DBT_PROJECT_DIR: airflow_dbt/include/northwind_dbt

jobs:

  deploy:
    name: Deploy dbt
    runs-on: ubuntu-latest
    timeout-minutes: 60

    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target || (github.ref == 'refs/heads/main' && 'production' || 'development') }}

    steps:

      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # 3. dbt
      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install "dbt-core==1.12.0" "dbt-databricks==1.12.4"

      # 4. Resolver target
      - name: Set deploy target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ github.event.inputs.target }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TARGET="prod"
          else
            TARGET="dev"
          fi

          echo "DBT_TARGET=${TARGET}" >> "$GITHUB_ENV"

          echo "Deploy target: ${TARGET}"

      # 5. Criar profiles.yml
      - name: Generate profiles.yml
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
          DATABRICKS_CATALOG: ${{ secrets.DATABRICKS_CATALOG }}
        run: |
          mkdir -p ~/.dbt

          cat > ~/.dbt/profiles.yml <<EOF
          northwind_dbt:
            target: ${DBT_TARGET}

            outputs:

              dev:
                type: databricks
                host: "${DATABRICKS_HOST}"
                http_path: "${DATABRICKS_HTTP_PATH}"
                token: "${DATABRICKS_TOKEN}"
                catalog: "${DATABRICKS_CATALOG}"
                schema: dbt_dev
                threads: 4

              prod:
                type: databricks
                host: "${DATABRICKS_HOST}"
                http_path: "${DATABRICKS_HTTP_PATH}"
                token: "${DATABRICKS_TOKEN}"
                catalog: "${DATABRICKS_CATALOG}"
                schema: bronze
                threads: 8
          EOF

      # 6. dbt deps
      - name: dbt deps
        working-directory: ${{ env.DBT_PROJECT_DIR }}
        run: dbt deps

      # 7. dbt parse
      - name: dbt parse
        working-directory: ${{ env.DBT_PROJECT_DIR }}
        run: dbt parse --target "$DBT_TARGET"

      # 8. dbt build
      - name: dbt build
        working-directory: ${{ env.DBT_PROJECT_DIR }}
        run: |
          if [ "${{ github.event.inputs.full_refresh }}" = "true" ]; then
            dbt build \
              --target "$DBT_TARGET" \
              --full-refresh
          else
            dbt build \
              --target "$DBT_TARGET"
          fi

      # 9. Upload manifest
      - name: Upload dbt manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-manifest-${{ github.sha }}
          path: ${{ env.DBT_PROJECT_DIR }}/target/manifest.json
          retention-days: 30

      # 10. Falha
      - name: Log failure
        if: failure()
        run: |
          echo "::error::Deploy falhou."
          echo "Environment: ${{ job.environment.name }}"
          echo "Target: ${DBT_TARGET}"
          echo "Commit: ${{ github.sha }}"
