version: 2

# ---------------------------------------------------------------------------
# Documentação da camada Intermediate (Silver)
# Modelos efêmeros (ephemeral) — não materializados no Databricks.
# São injetados como CTEs nas models da camada Marts.
# ---------------------------------------------------------------------------

models:

  - name: int_order_items_enriched
    description: >
      Enriquecimento dos itens de pedido com dados de produto, categoria e
      fornecedor. Materializado como ephemeral — não cria objeto no Databricks.
      Serve como base para a tabela fato fct_order_items.
    columns:
      - name: order_id
        description: FK para stg_orders.order_id.
      - name: product_id
        description: FK para stg_products.product_id.
      - name: product_name
        description: Nome do produto no momento do pedido.
      - name: category_id
        description: FK para stg_categories.category_id.
      - name: category_name
        description: Nome da categoria do produto.
      - name: supplier_id
        description: FK para stg_suppliers.supplier_id.
      - name: supplier_name
        description: Nome do fornecedor.
      - name: unit_price
        description: Preço unitário cobrado no item.
      - name: quantity
        description: Quantidade do item no pedido.
      - name: discount_rate
        description: Taxa de desconto aplicada (0.0 a 1.0).
      - name: gross_amount
        description: Valor bruto do item.
      - name: net_amount
        description: Valor líquido do item após desconto.

  - name: int_orders_enriched
    description: >
      Enriquecimento dos pedidos com dados de cliente, funcionário e
      transportadora. Materializado como ephemeral.
      Serve como base para a tabela fato fct_order_items.
    columns:
      - name: order_id
        description: PK do pedido.
      - name: customer_id
        description: FK para stg_customers.customer_id.
      - name: customer_company_name
        description: Nome da empresa cliente.
      - name: customer_country
        description: País do cliente.
      - name: employee_id
        description: FK para stg_employees.employee_id.
      - name: employee_full_name
        description: Nome completo do funcionário responsável pelo pedido.
      - name: shipper_id
        description: FK para stg_shippers.shipper_id.
      - name: shipper_name
        description: Nome da transportadora.
      - name: order_date
        description: Data do pedido.
      - name: shipped_date
        description: Data de envio do pedido.
      - name: shipping_status
        description: Status de envio (Pendente, Atrasado, No prazo).
      - name: freight_amount
        description: Valor do frete em dólares.
